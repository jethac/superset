#
# Escape hatch for `.github/workflows/nightly-advisory-scan.yml`.
#
# Only malware-class advisories can fail that workflow, so this file only
# affects those. An entry keeps one advisory from failing the run; the
# advisory still appears in the digest. Every field is required:
#
#   - id:       advisory identifier, or any alias of it (GHSA-…, MAL-…, CVE-…)
#     package:  package name the advisory is filed against
#     reason:   why the repository is not exposed, in one sentence
#     expires:  YYYY-MM-DD, after which the entry stops suppressing and the
#               run fails again. Renewals are meant to be re-argued, not
#               rubber-stamped.
#
# An advisory against a name the lockfile resolves to a local `file:` path
# does not need an entry: the scan already reports those separately, because
# the advisory describes registry code the repository does not install.

suppressions: []
